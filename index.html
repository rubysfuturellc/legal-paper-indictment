<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8.5&quot; &times; 14&quot; &ldquo;Legal&rdquo; Paper &mdash; Claire Kowalski</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #111214;
      color: #f4efe1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: min(96vw, calc(94vh * 16 / 9));
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .play-btn {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid rgba(244, 239, 225, 0.85);
      background: rgba(17, 18, 20, 0.68);
      color: #f4efe1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 160ms ease, transform 160ms ease, background 160ms ease;
    }
    .play-btn:hover {
      background: rgba(122, 30, 44, 0.88);
      transform: scale(1.06);
    }
    .play-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .play-btn svg {
      width: 34px;
      height: 34px;
      margin-left: 4px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <main class="stage">
    <video id="player" controls playsinline preload="metadata">
      <source src="./video.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
    <button id="playOverlay" class="play-btn" type="button" aria-label="Play presentation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6,4 20,12 6,20" /></svg>
    </button>
  </main>

  <script>
    const video = document.getElementById("player");
    const overlay = document.getElementById("playOverlay");

    function syncOverlay() {
      overlay.classList.toggle("hidden", !video.paused);
    }

    function togglePlay() {
      if (video.paused || video.ended) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }

    overlay.addEventListener("click", togglePlay);
    video.addEventListener("play", syncOverlay);
    video.addEventListener("pause", syncOverlay);
    video.addEventListener("ended", syncOverlay);

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && document.activeElement !== video) {
        e.preventDefault();
        togglePlay();
      }
    });
  </script>
</body>
</html>
